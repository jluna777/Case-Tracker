<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New case</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F8FAFC}
a{color:#4F46E5}a:hover{color:#3730A3}
.chip{font:inherit;font-size:13px;font-weight:500;color:#334155;min-height:40px;padding:0 14px;border:1px solid #E2E8F0;border-radius:999px;background:#FFFFFF}
.inp{font:inherit;font-size:14px;color:#0F172A;min-height:44px;padding:0 14px;border:1px solid #E2E8F0;border-radius:10px;background:#FFFFFF;box-sizing:border-box;width:100%}
.lbl{display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:6px}
.req{color:#DC2626}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;font:inherit;font-size:14px;font-weight:600;text-decoration:none;background:#4F46E5;color:#FFFFFF;border:0;cursor:pointer}
.btn:hover{background:#4338CA;color:#FFFFFF}
.btn2{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;font:inherit;font-size:14px;font-weight:600;text-decoration:none;background:#FFFFFF;color:#0F172A;border:1px solid #E2E8F0;cursor:pointer}
.btn2:hover{background:#F8FAFC;color:#0F172A}
.av{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-size:12px;font-weight:600;color:#FFFFFF;flex:none}
.av-a{background:#6366F1}
.seg{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;border:1px solid #E2E8F0;border-radius:10px;background:#FFFFFF;cursor:pointer;font-size:14px;font-weight:500;color:#334155}
.seg input{margin:0;accent-color:#4F46E5}
.seg-on{border-color:#4F46E5;background:#EEF2FF;box-shadow:0 0 0 3px #E0E7FF;color:#3730A3;font-weight:600}
.pd{width:8px;height:8px;border-radius:50%;flex:none}
</style>
</head>
<body>
<div style="min-height: 100vh; background: #F8FAFC; color: #0F172A; font-family: Inter, system-ui, sans-serif; font-size: 14px">
<header style="max-width: 1280px; margin: 0 auto; padding: 14px 32px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
<a href="01-cases.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0F172A">
<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true" style="flex: none"><rect width="32" height="32" rx="9" fill="#4F46E5"></rect><g transform="rotate(-14 16 16)"><path d="M7 11a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2.6a2.4 2.4 0 0 0 0 4.8V21a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-2.6a2.4 2.4 0 0 0 0-4.8z" fill="#FFFFFF"></path><path d="M12.2 16.2l2.6 2.6 5-5.2" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></g></svg>
<span style="font-size: 16px; font-weight: 700; letter-spacing: -0.01em">Case Tracker</span>
</a>
<div style="display: flex; align-items: center; gap: 10px">
<label for="agent" style="font-size: 13px; color: #64748B">Acting as</label>
<span class="av av-a" aria-hidden="true">A</span>
<select id="agent" class="chip" style="border-radius: 10px"><option selected>Amy</option><option>John</option><option>Sam</option></select>
</div>
</header>
<main style="max-width: 760px; margin: 0 auto; padding: 8px 32px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
<a href="01-cases.html" style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; text-decoration: none; align-self: flex-start; min-height: 32px"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"></path></svg>Cases</a>
<div>
<h1 style="margin: 0; font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: -0.02em">New case</h1>
<p style="margin: 4px 0 0; color: #64748B">New cases start in status New. Fields marked <span class="req">*</span> are required.</p>
</div>
<form style="background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 14px; padding: 28px; display: flex; flex-direction: column; gap: 22px; box-shadow: 0 1px 2px rgba(15,23,42,0.04),0 6px 20px rgba(15,23,42,0.05)">
<div>
<label class="lbl" for="title">Title <span class="req">*</span></label>
<input id="title" class="inp" type="text" value="Donation receipts not emailing after payment">
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px">
<div>
<label class="lbl" for="customer">Customer <span class="req">*</span></label>
<select id="customer" class="inp"><option>Great Lakes Planning Assn.</option><option>Harborview Mutual Insurance</option><option>Keystone Mechanical Contractors</option><option selected>Lakeshore Community Foundation</option><option>Midwest Fastener Co.</option><option>Prairie Valve &amp; Pump</option></select>
</div>
<div>
<label class="lbl" for="category">Category <span class="req">*</span></label>
<select id="category" class="inp"><option>D365 Sales</option><option>Customer Service</option><option selected>Power Automate</option><option>Integration</option></select>
</div>
</div>
<fieldset style="border: 0; margin: 0; padding: 0; min-width: 0">
<legend class="lbl" style="padding: 0">Priority <span class="req">*</span></legend>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<label class="seg seg-on"><input type="radio" name="priority" checked><span class="pd" style="background: #DC2626"></span>High</label>
<label class="seg"><input type="radio" name="priority"><span class="pd" style="background: #D97706"></span>Medium</label>
<label class="seg"><input type="radio" name="priority"><span class="pd" style="background: #94A3B8"></span>Low</label>
</div>
<div style="display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 14px; background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 10px; font-size: 13px; color: #334155">
<svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#4F46E5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="10" cy="10" r="7"></circle><path d="M10 6v4l2.5 1.5"></path></svg>
<span>Due <b style="color: #0F172A">Fri, Oct 23 at 2:30 PM</b> · 24 hours from now (High)<br><span style="color: #64748B">High = 24 hours · Medium = 3 days · Low = 5 days</span></span>
</div>
</fieldset>
<div style="max-width: 340px">
<label class="lbl" for="assignee">Assignee</label>
<select id="assignee" class="inp"><option>Unassigned</option><option>Amy</option><option selected>John</option><option>Sam</option></select>
</div>
<div>
<label class="lbl" for="desc">Description</label>
<textarea id="desc" rows="5" class="inp" style="padding: 12px 14px; resize: vertical; line-height: 21px">Since Tuesday, donors who pay online get a payment confirmation but no tax receipt email. The “Send receipt” flow shows successful runs. Reported by Priya Shah, Development Director.</textarea>
</div>
<div style="display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; border-top: 1px solid #F1F5F9; padding-top: 22px">
<a href="01-cases.html" class="btn2">Cancel</a>
<button type="submit" class="btn">Create case</button>
</div>
</form>
</main>
</div>
</body>
</html>
